<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<link rel='stylesheet' href='__CSS_HL__'>
<link rel='stylesheet' href='__CSS_KATEX__'>
<style>
html, body {
  height: 100%;
  margin: 0;
  background: #ffffff;
  color: #111111;
}

:root {
  --mark-bg: #ffeb3b;
  --mark-bg-dark: #d4af37;
  --mark-fg: #000;

  --link-color: #0645ad;
  --link-color-visited: #0b0080;
  --link-color-dark: #78b7e6;
  --link-color-dark-visited: #78b7e6;

  --sb-track: #ececec;
  --sb-thumb: #9f9f9f;
  --sb-thumb-hover: #8b8b8b;
  --sb-corner: #ececec;
}

a { color: var(--link-color); }
a:visited { color: var(--link-color-visited); }
a:hover { text-decoration: underline; }

body {
  font-family: "Segoe UI", sans-serif;
  font-size: __FONT_SIZE__px;
  overflow: hidden;
}

#main_shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

#scroll_area {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 20px;
  padding-top: 20px;
  padding-bottom: 12px;
}

pre {
  background: #f4f4f4;
  padding: 12px;
  border-radius: 4px;
  overflow-x: auto;
  color: #111111;
}

#content { line-height: 1.6; }
#content > :first-child { margin-top: 0 !important; }

#raw_view,
#edit_view {
  display: none;
  white-space: pre-wrap;
  font-family: monospace;
  background: #f8f9fa;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 4px;
  margin-top: 10px;
  color: #111111;
}

#raw_view {
  margin-top: 0;
}

#edit_view {
  width: 100%;
  min-height: 250px;
  box-sizing: border-box;
  background: #fff;
  border: 2px solid #0078d4;
  outline: none;
  font-size: 14px;
  resize: none;
  overflow-y: auto;
}

mark { background: var(--mark-bg); color: var(--mark-fg); }

html.dark-mode,
body.dark-mode {
  background: #1e1e1e !important;
  color: #e0e0e0 !important;
}

body.dark-mode pre,
body.dark-mode code,
body.dark-mode #raw_view,
body.dark-mode #edit_view {
  background: #2d2d2d !important;
  color: #e0e0e0 !important;
  border-color: #444 !important;
}

body.dark-mode mark { background: var(--mark-bg-dark); color: var(--mark-fg); }

body.dark-mode .hljs,
body.dark-mode pre code,
body.dark-mode pre code.hljs {
  color: #e0e0e0 !important;
  background: #2d2d2d !important;
}

body.dark-mode .hljs * { color: inherit !important; }

body.dark-mode .katex,
body.dark-mode .katex * {
  color: #e0e0e0 !important;
}

body.dark-mode a,
body.dark-mode a:visited {
  color: var(--link-color-dark) !important;
}

body.dark-mode a:hover {
  color: var(--link-color-dark) !important;
  text-decoration: underline;
}

body.dark-mode {
  --sb-track: #2a2a2a;
  --sb-thumb: #7b7b7b;
  --sb-thumb-hover: #929292;
  --sb-corner: #2a2a2a;
}

#scroll_area,
#debug_bar {
  scrollbar-color: var(--sb-thumb) var(--sb-track);
}

#scroll_area::-webkit-scrollbar,
#debug_bar::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}

#scroll_area::-webkit-scrollbar-track,
#debug_bar::-webkit-scrollbar-track {
  background: var(--sb-track);
}

/* Keep scrollbar caps visually clear from the top toolbar edge. */
#scroll_area::-webkit-scrollbar-track {
  margin-top: 8px;
}

#scroll_area::-webkit-scrollbar-thumb,
#debug_bar::-webkit-scrollbar-thumb {
  background: var(--sb-thumb);
  border-radius: 10px;
  border: 2px solid var(--sb-track);
}

#scroll_area::-webkit-scrollbar-thumb:hover,
#debug_bar::-webkit-scrollbar-thumb:hover {
  background: var(--sb-thumb-hover);
}

#scroll_area::-webkit-scrollbar-corner,
#debug_bar::-webkit-scrollbar-corner {
  background: var(--sb-corner);
}

/* Marker line shown when this translation inherited the conversation context. */
#context_note {
  display: none;
  margin-bottom: 12px;
  padding: 6px 10px;
  border-left: 3px solid #2563eb;
  border-radius: 3px;
  background: rgba(37, 99, 235, 0.08);
  color: #1d4ed8;
  font-size: 12px;
  line-height: 1.4;
}

body.dark-mode #context_note {
  background: rgba(96, 165, 250, 0.14);
  color: #9ecbff;
  border-left-color: #60a5fa;
}

#debug_bar {
  display: none !important;
  flex: 0 0 auto;
  border-top: 1px solid rgba(127, 127, 127, 0.35);
  padding: 4px 10px 6px 10px;
  min-height: 18px;
  max-height: 96px;
  overflow-x: auto;
  overflow-y: auto;
}

#debug_lines {
  white-space: pre;
  font-family: Consolas, "SFMono-Regular", Menlo, Monaco, monospace;
  font-size: 11px;
  line-height: 1.25;
  color: #555;
}

body.dark-mode #debug_bar {
  border-top-color: rgba(255, 255, 255, 0.22);
  background: transparent;
}

body.dark-mode #debug_lines {
  color: #cfcfcf;
}

#copy_toast {
  position: fixed;
  right: 18px;
  top: 16px;
  z-index: 30;
  pointer-events: none;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity 160ms ease, transform 160ms ease;
  padding: 7px 12px;
  border-radius: 4px;
  background: rgba(24, 24, 24, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #ffffff;
  font-size: 12px;
  font-weight: 600;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
}

#copy_toast.show {
  opacity: 1;
  transform: translateY(0);
}

body.dark-mode #copy_toast {
  background: rgba(52, 52, 52, 0.92);
  border-color: rgba(255, 255, 255, 0.14);
}

/* ---- Action bar: visible buttons mirroring the configurable hotkeys ---- */
#action_bar {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px;
  padding: 3px 8px;
  background: #f6f7f9;
  border-bottom: 1px solid rgba(0, 0, 0, 0.08);
}

#action_bar:empty {
  display: none;
}

.abtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-width: 26px;
  height: 26px;
  padding: 0 6px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  color: #333333;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
  user-select: none;
}

.abtn:hover {
  background: rgba(0, 0, 0, 0.07);
}

.abtn:active {
  background: rgba(0, 0, 0, 0.13);
}

.abtn:focus-visible {
  outline: 2px solid #0078d4;
  outline-offset: 1px;
}

.abtn[aria-pressed='true'] {
  background: rgba(0, 120, 212, 0.16);
  border-color: rgba(0, 120, 212, 0.45);
  color: #005a9e;
}

.abtn:disabled {
  opacity: 0.35;
  background: transparent;
  cursor: default;
}

.abtn .ab-key {
  font-size: 10px;
  font-weight: 400;
  opacity: 0.55;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.abtn .ab-ico {
  font-size: 14px;
  font-weight: 500;
}

/* Make the format buttons look like what they do. */
.abtn[data-act='bold'] .ab-ico {
  font-weight: 700;
}

.abtn[data-act='underline'] .ab-ico {
  text-decoration: underline;
}

.abtn[data-act='highlight'] .ab-ico {
  background: var(--mark-bg);
  color: var(--mark-fg);
  border-radius: 2px;
  padding: 0 2px;
  font-size: 12px;
}

body.dark-mode .abtn[data-act='highlight'] .ab-ico {
  background: var(--mark-bg-dark);
}

.ab-sep {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(0, 0, 0, 0.14);
}

body.dark-mode #action_bar {
  background: #252525;
  border-bottom-color: rgba(255, 255, 255, 0.12);
}

body.dark-mode .abtn {
  color: #dcdcdc;
}

body.dark-mode .abtn:hover {
  background: rgba(255, 255, 255, 0.10);
}

body.dark-mode .abtn:active {
  background: rgba(255, 255, 255, 0.16);
}

body.dark-mode .abtn[aria-pressed='true'] {
  background: rgba(90, 170, 255, 0.22);
  border-color: rgba(90, 170, 255, 0.55);
  color: #d5e9ff;
}

body.dark-mode .ab-sep {
  background: rgba(255, 255, 255, 0.16);
}
</style>
<script src='__JS_MARKED__'></script>
<script src='__JS_HL__'></script>
<script src='__JS_KATEX__'></script>
<script src='__JS_KATEX_AUTO__'></script>
</head>

  <div id='scroll_area'>
    <div id='content'><h3>Loading...</h3></div>

    <div id='raw_view'></div>
  </div>
  <div id='debug_bar'><div id='debug_lines'>debug: -</div></div>
</div>

</body>
</html>
